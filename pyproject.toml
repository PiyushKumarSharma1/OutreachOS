[project]
name = "outreachos"
version = "0.1.0"
description = "Autonomous AI Outreach & Lead Generation Agency OS - multi-agent system with a shared Common Pool"
requires-python = ">=3.11"

[project.scripts]
outreachos = "outreachos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
