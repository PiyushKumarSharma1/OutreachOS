[project]
name = "outreachos"
version = "0.5.0"
description = "Autonomous AI Outreach & Lead Generation Agency OS - multi-agent system with a shared Common Pool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.scripts]
outreachos = "outreachos.cli:main"
outreachos-mcp = "outreachos.mcp_server:main"
outreachos-api = "outreachos.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"