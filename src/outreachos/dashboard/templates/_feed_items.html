{% for e in events %}
<div class="feed-item" data-eid="{{ e.id }}">
  <div class="feed-icon {% if e.agent in ['hunter','guardian','profiler','copywriter','sdr','networker','pipeline','security','engine','scheduler'] %}{{ e.agent }}{% endif %}"></div>
  <div class="feed-content">
    <span class="feed-agent">{{ e.agent }}</span>
    <div class="feed-action">{{ e.action.replace('_',' ') }}</div>
    <span class="feed-target">{{ e.target }}</span>
    <time class="feed-time mono">{{ e.ago }}</time>
  </div>
</div>
{% else %}
<div class="empty-state" style="padding:var(--space-6);"><div class="icon">◉</div><div class="empty-state-desc">No agent activity yet.</div></div>
{% endfor %}
